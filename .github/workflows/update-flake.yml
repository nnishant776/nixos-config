# Weekly refresh of flake.lock, so security fixes in nixpkgs and the other
# inputs reach the fleet without someone remembering to run it. Evaluation is
# checked here; building is left to the machines, which cache the result.
name: Update flake inputs

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Update inputs
        run: nix flake update
      - name: Every system output must still evaluate purely
        run: nix run .#check-purity
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update flake inputs"
          title: "chore: weekly flake input update"
          body: |
            Automated `nix flake update`. `check-purity` passed on every system output.
          branch: ci/update-flake
          delete-branch: true
