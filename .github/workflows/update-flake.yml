# Weekly refresh of flake.lock, so security fixes in nixpkgs and the other
# inputs reach the fleet without someone remembering to run it. Evaluation is
# checked here; building is left to the machines, which cache the result.
#
# The pull request is opened with the gh CLI that GitHub-hosted runners ship
# with, rather than a third-party action. The repository setting "Allow GitHub
# Actions to create and approve pull requests" must be on for the last step.
name: Update flake inputs

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH: ci/update-flake

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update inputs
        run: nix flake update

      - name: Every system output must still evaluate purely
        run: nix run .#check-purity

      - name: Open or refresh the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- flake.lock; then
            echo "flake.lock unchanged; nothing to propose"
            # A stale proposal from an earlier week no longer applies.
            git push --quiet origin --delete "$BRANCH" 2>/dev/null || true
            exit 0
          fi

          git checkout --quiet -B "$BRANCH"
          git commit --quiet -m "chore: update flake inputs" -- flake.lock
          # Force: the branch is this workflow's alone and always one commit
          # ahead of the base. Pushing over an open PR updates it in place.
          git push --quiet --force origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            # shellcheck disable=SC2016 # literal backticks: Markdown code spans
            gh pr create \
              --base "$GITHUB_REF_NAME" \
              --head "$BRANCH" \
              --title "chore: weekly flake input update" \
              --body 'Automated `nix flake update`. `check-purity` passed on every system output.'
          fi
